name: Compile and smoke-test all C programs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install compiler and OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      - name: Compile every question
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make all
          echo "All 40 C source files compiled successfully."
      - name: Smoke-test fixed examples
        shell: bash
        run: |
          set -euo pipefail
          ./build/q22_sdes_cbc | grep -q "11110100 00001011"
          ./build/q23_sdes_ctr | grep -q "00111000 01001111 00110010"
          ./build/q24_rsa_private_key | grep -q "Private exponent d=e\^-1 mod phi(n)=3031"
          echo "Known-answer smoke tests passed."
